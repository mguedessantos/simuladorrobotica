<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulador 3D de Robótica</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root {
  --bg: #f0f4f8;
  --panel: #ffffff;
  --ink: #334155;
  --ink-dark: #0f172a;
  --mute: #64748b;
  --line: #e2e8f0;
  --acc: #3b82f6; /* Vibrant Blue */
  --acc-hover: #2563eb;
  --acc-ink: #ffffff;
  --soft: #eff6ff;
  --run: #22c55e; /* Green */
  --stop: #ef4444; /* Red */
  --warn: #f59e0b; /* Orange */
  
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
  --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
  --radius-sm: 8px;
  --radius: 12px;
  --radius-lg: 16px;
  
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f172a;
    --panel: #1e293b;
    --ink: #e2e8f0;
    --ink-dark: #f8fafc;
    --mute: #94a3b8;
    --line: #334155;
    --acc: #3b82f6;
    --soft: #1e3a8a;
    --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
  }
}

:root[data-theme="dark"] {
    --bg: #0f172a; --panel: #1e293b; --ink: #e2e8f0; --ink-dark: #f8fafc; --mute: #94a3b8; --line: #334155; --acc: #3b82f6; --soft: #1e3a8a;
}

html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.5 "Atkinson Hyperlegible", system-ui, -apple-system, sans-serif;
}

.app { display: flex; flex-direction: column; height: 100%; }

/* --- HEADER --- */
header {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px;
  padding: 12px 20px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
  box-shadow: var(--shadow-sm);
  z-index: 10;
}

h1 {
  font-size: 20px;
  font-weight: 700;
  color: var(--ink-dark);
  margin: 0 16px 0 0;
  display: flex;
  align-items: center;
  gap: 8px;
}

.sp { flex: 1; }

/* --- BUTTONS & INPUTS --- */
button, select, input[type=text] {
  font: inherit;
  color: var(--ink);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 8px 14px;
  transition: all 0.2s ease;
  box-shadow: var(--shadow-sm);
}

button {
  cursor: pointer;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

button:hover {
  border-color: var(--acc);
  transform: translateY(-1px);
  box-shadow: var(--shadow);
}

button:active {
  transform: translateY(0px);
}

button:focus-visible, select:focus-visible, input:focus-visible {
  outline: 2px solid var(--acc);
  outline-offset: 2px;
}

button.pri {
  background: var(--acc);
  color: var(--acc-ink);
  border-color: var(--acc);
  text-shadow: 0 1px 2px rgba(0,0,0,0.1);
}

button.pri:hover {
  background: var(--acc-hover);
  border-color: var(--acc-hover);
}

button.on {
  background: var(--soft);
  color: var(--acc);
  border-color: var(--acc);
  box-shadow: 0 0 0 1px var(--acc);
}

/* Specific Action Buttons */
#run { background: var(--run); border-color: var(--run); color: white; }
#run:hover { background: #16a34a; border-color: #16a34a; }
#stop { background: var(--panel); color: var(--stop); border-color: var(--line); }
#stop:hover { border-color: var(--stop); background: #fef2f2; }
#reset { background: var(--panel); color: var(--warn); border-color: var(--line); }
#reset:hover { border-color: var(--warn); background: #fffbeb; }

label {
  display: inline-flex;
  gap: 6px;
  align-items: center;
  font-weight: 600;
  color: var(--mute);
  cursor: pointer;
  padding: 6px 10px;
  border-radius: var(--radius-sm);
  background: var(--bg);
  border: 1px solid transparent;
}
label:hover { border-color: var(--line); }

/* --- MAIN LAYOUT --- */
main {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(320px, 2fr) 3fr;
  gap: 16px;
  padding: 16px;
  background: var(--bg);
}

@media (max-width: 900px) {
  main {
    grid-template-columns: 1fr;
    grid-auto-rows: minmax(440px, auto);
    overflow: auto;
  }
}

/* --- PANELS (Cards) --- */
.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  min-height: 0;
}

.ct {
  padding: 12px 16px;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
  font-weight: 700;
  color: var(--ink-dark);
  font-size: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  padding: 10px 16px;
  border-bottom: 1px solid var(--line);
  background: var(--panel);
}

.row b { color: var(--ink-dark); margin-right: 4px; }

#blocks { flex: 1; min-height: 380px; }
#view { flex: 1; min-height: 380px; position: relative; touch-action: none; background: var(--bg); }
#view canvas { display: block; width: 100%; height: 100%; }

/* --- STATUS & HUD --- */
.st {
  padding: 8px 16px;
  color: var(--mute);
  font-size: 14px;
  border-bottom: 1px solid var(--line);
  background: var(--panel);
}

.hud {
  position: absolute;
  top: 12px;
  width: 240px;
  max-height: calc(100% - 24px);
  overflow: auto;
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(4px);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 12px 14px;
  font-size: 13px;
  line-height: 1.5;
  pointer-events: none;
  z-index: 5;
  box-sizing: border-box;
  box-shadow: var(--shadow-lg);
  color: var(--ink);
}

@media (prefers-color-scheme: dark) {
  .hud { background: rgba(30, 41, 59, 0.95); }
}

#hudL { left: 12px; }
#hudR { right: 12px; }

/* Custom Scrollbar for modern look */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

/* --- TUTORIAL --- */
#tut{padding:10px 16px 12px;border-bottom:1px solid var(--line);border-left:5px solid var(--acc);background:var(--soft);font-size:14px}
#tut .tt{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:16px;font-weight:700;color:var(--ink-dark)}
#tut .tt button,#tut .tt select{padding:4px 10px;font-size:13px}
#tutFold{width:30px;padding:2px 0!important}
#tutDots{display:inline-flex;gap:3px;align-items:center}
#tutDots i{width:9px;height:9px;border-radius:50%;background:var(--line);display:inline-block}
#tutDots i.d{background:var(--run)}#tutDots i.c{background:var(--acc);box-shadow:0 0 0 2px var(--soft),0 0 0 3px var(--acc)}
#tut .tb{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:10px 16px;margin-top:8px;align-items:start}
#tut.fold .tb{display:none}
#tut .hint{margin-top:8px;padding:6px 10px;border-left:3px solid var(--warn);background:var(--panel);border-radius:6px}
#tutL{display:flex;flex-direction:column;gap:3px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
#tut .ok{color:#16a34a;font-weight:700}
@media (max-width:1150px){#tut .tb{grid-template-columns:1fr}}
#rowFiles .grp{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:4;padding:20px;text-align:center}
#empty .eb{background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:14px;padding:18px 28px;box-shadow:var(--shadow-lg);max-width:min(90%,520px);display:flex;flex-direction:column;gap:6px}
#empty b{font-size:clamp(20px,3vw,32px);color:var(--ink-dark)}
#empty span{color:var(--mute);font-size:14px}
@media (prefers-color-scheme: dark){#empty .eb{background:rgba(30,41,59,.92)}}
/* --- blocos recolhíveis --- */
main{transition:grid-template-columns .25s ease}
main.cl{grid-template-columns:52px 1fr}
main.cl>.card:first-child #blocks,main.cl #tutClr,main.cl>.card:first-child .sp{display:none}
main.cl>.card:first-child .ct{flex-direction:column;align-items:center;padding:10px 0;height:100%;box-sizing:border-box}
main.cl .ctl{writing-mode:vertical-rl;white-space:nowrap}
#blkFold{padding:2px 9px;font-size:13px}
@media (max-width:900px){
  main.cl{grid-template-columns:1fr;grid-auto-rows:auto}
  main.cl>.card:first-child{min-height:54px;flex:none}
  main.cl>.card:first-child .ct{flex-direction:row;height:auto}
  main.cl .ctl{writing-mode:horizontal-tb}
  main.cl>.card:last-child{min-height:440px}
}
</style>
</head>
<body>
<div class="app">
<header>
  <h1>🤖 RoboSim 3D</h1>
  <button data-mode="sim" class="on">🎮 Simular</button>
  <button data-mode="build">🔧 Montar robô</button>
  <button data-mode="arena">🗺️ Arena</button>
  <button id="tutBtn">🆓 Modo livre</button>
  <div class="sp"></div>
  <label><input type="checkbox" id="noise"> 〰️ Ruído dos sensores</label>
  <label>⚡ Velocidade 
    <select id="spd">
      <option value="1">1×</option>
      <option value="2">2×</option>
      <option value="4">4×</option>
    </select>
  </label>
  <button id="run" class="pri">▶️ Executar</button>
  <button id="stop">⏹️ Parar</button>
  <button id="reset">🔄 Reiniciar</button>
</header>
<main>
  <section class="card">
    <div class="ct"><button id="blkFold" title="Recolher blocos">◀</button><span class="ctl">🧩 Programação em blocos</span><span class="sp"></span><button id="tutClr" title="Apagar todos os blocos">🧹 Limpar blocos</button></div>
    <div id="blocks"></div>
  </section>
  <section class="card">
    <div id="tut">
      <div class="tt">
        <button id="tutFold" title="Recolher/expandir instruções">▾</button>
        <span id="tutT"></span><span id="tutDots"></span>
        <select id="tutSel"></select>
        <span class="sp"></span>
        <button id="tutHint">💡 Dica</button>
        <button id="tutChk" class="pri">✅ Verificar robô</button>
        <button id="tutRst">🔁 Recomeçar fase</button>
      </div>
      <div class="tb"><div id="tutD"></div><div id="tutL"></div></div>
    </div>
    <div class="row" id="rowBuild" style="display:none">
      <b>🧱 Peças:</b>
      <button data-part="block" class="on">Bloco</button>
      <button data-part="wheel">Motor TT + roda</button>
      <button data-part="caster">Rodízio (esfera)</button>
      <button data-part="claw">Garra com servo</button>
      <button data-part="color">Sensor cor</button>
      <button data-part="ultra">Ultrassônico</button>
      <button data-part="gyro">Giroscópio</button>
      <button data-part="battery">Bateria</button>
      <span class="sp"></span>
      <button data-part="move">🖐️ Mover</button>
      <button data-part="erase">🗑️ Apagar</button>
      <button id="defbot">🤖 Padrão</button>
      <button id="clawbot">🦀 C/ Garra</button>
      <button id="clrbot">✨ Limpar</button>
      <button id="undo">↩️ Desfazer</button>
      <label>🧭 Frente <select id="frontSel"><option value="0">↑ topo da tela</option><option value="1">→ direita</option><option value="2">↓ baixo</option><option value="3">← esquerda</option></select></label>
      <label><input type="checkbox" id="lbl" checked> Rótulos</label>
      <span class="sp"></span>
      <input type="text" id="rnm" placeholder="Nome do robô" size="14">
      <button id="rbSave" class="pri">💾 Salvar robô</button>
      <button id="rbOpen">📂 Abrir robô</button>
      <input type="file" id="rbFile" accept=".robosim,.json,application/json" style="display:none">
    </div>
    
    <div class="row" id="rowArena" style="display:none">
      <button data-tool="select" class="on">🖱️ Selecionar</button>
      <button data-tool="line">📏 Reta</button>
      <button data-tool="ring">⭕ Círculo</button>
      <button data-tool="garea">🟩 Área verde</button>
      <button data-tool="green">🟢 Marcador</button>
      <button data-tool="wall">🧱 Obstáculo</button>
      <button data-tool="ramp">📐 Rampa</button>
      <button data-tool="bump">🥾 Lombada</button>
      <button data-tool="vic">⚽ Bolinha</button>
      <button data-tool="cube">📦 Cubo</button>
      <button data-tool="zone">🟦 Zona resgate</button>
      <button data-tool="goal">🟨 Ponto final</button>
      <button data-tool="robot">📍 Posicionar robô</button>
      <button data-tool="ruler">📏 Régua</button>
      <span class="sp"></span>
      <button id="rot">🔄 Girar 15°</button>
      <button id="del">🗑️ Excluir</button>
      <button id="demo">🚀 Desafio rampa</button>
      <button id="demoR1">🚒 Resgate 1</button>
      <button id="demoR2">🦀 Resgate 2</button>
      <button id="clr">✨ Limpar</button>
    </div>

    <div class="row" id="rowObr" style="display:none">
      <b>🏆 Sala OBR (Nível 1):</b>
      <select id="obrSize">
        <option value="">Tamanho aleatório</option>
        <option value="33">3×3 (90×90 cm)</option>
        <option value="34">3×4 (120×90 cm)</option>
      </select>
      <select id="obrExit">
        <option value="">Saída aleatória</option>
        <option value="E">Saída a leste</option>
        <option value="N">Saída ao norte</option>
        <option value="S">Saída ao sul</option>
      </select>
      <input type="text" id="obrSeed" placeholder="semente (opcional)" size="14">
      <label><input type="checkbox" id="obrCurso" checked> Com percurso</label>
      <button id="obrGen" class="pri">🎲 Gerar sala</button>
      <button id="obrShuf">🔀 Reposicionar</button>
      <button id="obrSol">💡 Exemplo solução</button>
    </div>

    <div id="view"><div id="hudL" class="hud"></div><div id="hudR" class="hud"></div><div id="empty"><div class="eb"><b>Crie ou Importe seu Robô e Arena</b><span>Monte o robô na aba 🔧 Montar robô (ou abra um arquivo .robosim) e abra uma arena com 📂 Abrir arena, abaixo.</span></div></div></div>
    
    <div class="st" id="st">Pronto.</div>
    <div class="st" id="sn"></div>
    
    <div class="row" id="rowFiles">
      <span class="grp" id="grpArena">
        <b>🗺️ Arena:</b>
        <input type="text" id="anm" placeholder="Nome da arena" size="14">
        <button id="arSave" class="pri">💾 Salvar arena</button>
        <button id="arOpen">📂 Abrir arena</button>
        <input type="file" id="arFile" accept=".arena,.json,application/json" style="display:none">
      </span>
      <span class="grp" id="grpProj" style="display:none">
        <b>🗂️ Projetos no navegador (robô + arena):</b>
        <input type="text" id="nm" placeholder="Nome do projeto" size="14">
        <button id="save">💾 Salvar</button>
        <select id="lst"></select>
        <button id="load">📂 Abrir</button>
        <button id="rm">🗑️ Apagar</button>
      </span>
    </div>
  </section>
</main>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/blockly@10.4.3/blockly_compressed.js"></script>
<script>
const $=id=>document.getElementById(id),DT=1/60,SPD=0.3,PXC=5,NI=11,NJ=13,CX=5,CY=6;
const cl=x=>Math.max(-100,Math.min(100,+x||0)),status=t=>$('st').textContent=t;
let parts=[],objs=[],sel=null,mode='sim',partTool='block',aTool='select',RB={};
let FR=2;const FV=[[0,-1],[1,0],[0,1],[-1,0]],fvec=()=>{const f=FV[FR];return{Fx:f[0],Fy:f[1],Lx:-f[1],Ly:f[0]};},
  dotF=(a,b)=>{const v=fvec();return a*v.Fx+b*v.Fy;},dotL=(a,b)=>{const v=fvec();return a*v.Lx+b*v.Ly;},
  fa=(a,b)=>{const x=b.i-a.i,y=b.j-a.j;return dotL(x,y)===0&&Math.abs(dotF(x,y))===1;};
const START={x:-100,z:0,a:0},bot={x:-100,z:0,a:0,l:0,r:0,v:0,w:0,move(d,v){const m={F:[v,v],B:[-v,-v],L:[-v,v],R:[v,-v]}[d];this.l=m[0];this.r=m[1];}};
const sim={time:0,running:false,gen:null,speed:1,c:{ramp:0,green:0,balls:0,end:0,hit:0}};

/* ---------- Piso (textura 2D lida pelos sensores) ---------- */
let AX=120,AZ=80;const fc=document.createElement('canvas');fc.width=2*AX*PXC;fc.height=2*AZ*PXC;
const F=fc.getContext('2d',{willReadFrequently:true});let px=null;
const tex=new THREE.CanvasTexture(fc);
function paintFloor(){F.fillStyle='#fff';F.fillRect(0,0,fc.width,fc.height);F.save();F.scale(PXC,PXC);F.translate(AX,AZ);F.lineCap='round';
  if(OBR.on){F.strokeStyle='#c9d1db';F.lineWidth=.35;F.beginPath();for(let x=-AX;x<=AX;x+=30){F.moveTo(x,-AZ);F.lineTo(x,AZ);}for(let z=-AZ+((15+AZ)%30);z<=AZ;z+=30){F.moveTo(-AX,z);F.lineTo(AX,z);}F.stroke();}
  for(const o of objs){
    if(o.t==='zone'){F.fillStyle='#bcd7ff';F.fillRect(o.x-o.w/2,o.z-o.d/2,o.w,o.d);}
    else if(o.t==='green'){const w=o.w||6,d=o.d||6;F.fillStyle='#1fa34a';F.fillRect(o.x-w/2,o.z-d/2,w,d);}
    else if(o.t==='goal'){F.fillStyle='#f4c542';F.fillRect(o.x-o.w/2,o.z-o.d/2,o.w,o.d);}
    else if(o.t==='tape'){F.fillStyle=o.c;F.fillRect(o.x-o.w/2,o.z-o.d/2,o.w,o.d);}
    else if(o.t==='tri'){F.fillStyle=o.c;F.beginPath();F.moveTo(o.x,o.z);F.lineTo(o.x+o.sx*o.s,o.z);F.lineTo(o.x,o.z+o.sz*o.s);F.closePath();F.fill();}
    else if(o.t==='arc'){F.strokeStyle='#111';F.lineWidth=2.5;F.beginPath();F.arc(o.x,o.z,o.r,o.a0,o.a1,!!o.ccw);F.stroke();}
    else if(o.t==='line'||o.t==='ring'){F.strokeStyle='#111';F.lineWidth=2.5;F.beginPath();if(o.t==='line'){F.moveTo(o.x1,o.z1);F.lineTo(o.x2,o.z2);}else F.arc(o.x,o.z,o.r,0,7);F.stroke();}}
  F.restore();px=F.getImageData(0,0,fc.width,fc.height).data;tex.needsUpdate=true;}
const rgb=(x,z)=>{const X=((x+AX)*PXC)|0,Y=((z+AZ)*PXC)|0;if(X<0||Y<0||X>=fc.width||Y>=fc.height)return[255,255,255];const i=(Y*fc.width+X)*4;return[px[i],px[i+1],px[i+2]];};
const lum=(x,z)=>{const c=rgb(x,z);return(0.299*c[0]+0.587*c[1]+0.114*c[2])/2.55;};

/* ---------- Terreno e colisões ---------- */
const loc=(o,x,z)=>{const dx=x-o.x,dz=z-o.z,c=Math.cos(o.rot),s=Math.sin(o.rot);return[dx*c+dz*s,-dx*s+dz*c];};
function hAt(x,z){let h=0;for(const o of objs){if(o.t!=='ramp'&&o.t!=='bump')continue;const[u,v]=loc(o,x,z);
  if(o.t==='ramp'){const t=u+50;if(Math.abs(v)<20&&t>0&&t<100)h=Math.max(h,t<35?12*t/35:t<65?12:12*(1-(t-65)/35));}
  else if(Math.abs(v)<30&&Math.abs(u)<2.5)h=Math.max(h,Math.sqrt(6.25-u*u));}

function delOnly(b){Blockly.Events.setGroup(true);try{
  const chains=[];for(const inp of b.inputList){if(inp.connection&&inp.connection.type===3&&inp.connection.targetBlock())chains.push(inp.connection.targetBlock());}
  const next=b.getNextBlock(),prevConn=b.previousConnection?b.previousConnection.targetConnection:null,xy=b.getRelativeToSurfaceXY();
  chains.forEach(c=>c.unplug());if(next)next.unplug();b.unplug();
  const seq=chains.concat(next?[next]:[]);let head=null,tail=null;
  seq.forEach((c,n)=>{if(!head)head=c;
    if(tail){let okc=false;try{if(tail.nextConnection&&c.previousConnection){tail.nextConnection.connect(c.previousConnection);okc=c.previousConnection.isConnected();}}catch(e){}
      if(!okc)c.moveBy(24*n,24*n);}
    tail=lastOf(c);});
  if(head){let okc=false;try{if(prevConn&&head.previousConnection){prevConn.connect(head.previousConnection);okc=head.previousConnection.isConnected();}}catch(e){}
    if(!okc){const q=head.getRelativeToSurfaceXY();head.moveBy(xy.x-q.x,xy.y-q.y);}}
  b.dispose(false);}finally{Blockly.Events.setGroup(false);}}

  items:()=>[IT('Chegar à área amarela',TUT.f.goal),IT('Sem bater nas paredes',!sim.c.hit,1)]},
 {n:'Sensor de cor: ler o chão',objs:()=>[{t:'tape',x:-10,z:0,w:12,d:70,c:'#111111'}],
  txt:'O robô precisa "ver" o chão. Na aba <b>Montar robô</b> adicione um <b>sensor de cor</b> na frente (camada de baixo) e programe o robô para andar até a fita preta e parar com o sensor em cima dela.',
  hint:'Use "espere até que sensor de cor SC1 vê preto" depois de "mover para frente", e então "parar motores". Clique nos blocos de sensor para ver o valor e acompanhe a caixa "Robô e sensores".',
  tick:()=>{if(stopped()&&!sim.c.hit&&RB.sens.some((s,i)=>S.color(i+1,'B')))TUT.f.a=1;},
  items:()=>[IT('Sensor de cor montado no robô',RB.sens.length>0),IT('Parar com um sensor sobre a fita preta',TUT.f.a),IT('Sem bater nas paredes',!sim.c.hit,1)]},
 {n:'Ultrassônico: detectar objetos',objs:()=>[WALL(55,0,60,Math.PI/2)],
  txt:'O sensor <b>ultrassônico</b> mede a distância até os objetos. Adicione um na frente do robô e pare a <b>no máximo 20 cm</b> da parede, sem encostar.',
  hint:'Dentro de "sempre": se a distância do ultra-sônico US1 &lt; 20 então "parar motores", senão "mover para frente". Os blocos de comparação estão em Operadores.',
  tick:()=>{if(RB.ultra&&stopped()){const d=S.ultra('W');if(d>=3&&d<=20&&!sim.c.hit)TUT.f.a=1;}},
  items:()=>[IT('Sensor ultrassônico montado no robô',RB.ultra),IT('Parar a até 20 cm da parede',TUT.f.a),IT('Sem bater nas paredes',!sim.c.hit,1)]},
 {n:'Seguir a linha',objs:()=>[...Poly([[-108,0],[-70,0],[-45,-25],[-10,-25],[15,5],[50,5],[75,-30],[98,-30]]),GOALO(98,-30)],
  txt:'Use os sensores de cor para o robô <b>acompanhar a linha preta</b> até a área amarela. Com 2 sensores (um de cada lado da linha) fica bem mais fácil.',
  hint:'Dentro de "sempre": se SC1 vê preto → motor esquerdo 10% e direito 50%; senão se SC2 vê preto → motor esquerdo 50% e direito 10%; senão → 50% e 50%.',
  tick:()=>{if(sim.running&&lineDist()>16)TUT.f.off=1;},
  items:()=>[IT('Sensor de cor montado no robô',RB.sens.length>0),IT('Chegar à área amarela',TUT.f.goal),IT('Não sair da linha (cortar caminho)',!TUT.f.off,1)]},
 {n:'Cruzamento com marcador verde',objs:()=>[...Poly([[-108,0],[0,0]]),Lg(0,-60,0,60),{t:'tape',x:-6,z:-4,w:4,d:5.5,c:'#1fa34a'},GOALO(0,-60)],
  txt:'Um quadrado <b>verde</b> ao lado da linha indica para que lado virar no cruzamento. Use dois sensores para ler o verde e vire para o lado do quadrado até chegar à área amarela.',
  hint:'Quando um sensor vê verde, guarde o lado numa variável. No cruzamento, vire para esse lado e volte a seguir a linha. Teste o bloco "sensor de cor vê verde".',
  tick:()=>{if(sim.running&&lineDist()>16)TUT.f.off=1;},
  items:()=>[IT('Dois sensores de cor montados',RB.sens.length>=2),IT('Virar para o lado do verde e chegar à área amarela',TUT.f.goal),IT('Não sair da linha (cortar caminho)',!TUT.f.off,1)]},
 {n:'Obstáculo na linha',objs:()=>[Lg(-108,0,98,0),{t:'wall',x:0,z:0,rot:0,len:12,th:12,h:12,col:0x374151},GOALO(98,0)],
  txt:'Há um bloco no meio da linha. Detecte-o com o <b>ultrassônico</b>, desvie, volte para a linha e chegue à área amarela sem bater.',
  hint:'Quando a distância for menor que uns 12 cm: pare, vire, ande de lado, vire de volta, passe pelo obstáculo e procure a linha de novo com o sensor.',
  items:()=>[IT('Sensor ultrassônico montado no robô',RB.ultra),IT('Chegar à área amarela',TUT.f.goal),IT('Sem bater no obstáculo ou nas paredes',!sim.c.hit,1)]},
 {n:'Subir a rampa',objs:()=>[Lg(-108,0,90,0),{t:'ramp',x:-45,z:0,rot:0},{t:'wall',x:105,z:-15,rot:Math.PI/2},{t:'wall',x:105,z:15,rot:Math.PI/2},GOALO(88,0)],
  txt:'A rampa exige motores fortes e centro de massa baixo. Suba a rampa, chegue à área amarela, sem tombar.',
  hint:'Se o robô tombar ou patinar: use mais rodas/motores, deixe as peças pesadas embaixo, coloque o rodízio e reduza a velocidade. A aba Montar robô mostra a inclinação máxima.',
  items:()=>[IT('Subir a rampa',sim.c.ramp),IT('Chegar à área amarela',TUT.f.goal),IT('Sem bater nas paredes',!sim.c.hit,1),IT('Sem tombar',!sim.c.tomb,1)]},
 {n:'Desafio completo',custom:()=>demo(),
  txt:'Suba a rampa, chegue à área verde, empurre as 3 bolinhas para fora dela, vá até o ponto final amarelo e pare antes da parede.',
  hint:'Planeje o programa por etapas: seguir a linha até a rampa, subir, entrar na área verde, empurrar as bolinhas com o corpo do robô e seguir até o ponto final.',
  items:()=>{const c=sim.c;return[IT('Subir a rampa',c.ramp),IT('Chegar à área verde',c.green),IT('Empurrar as bolinhas para fora',c.balls),IT('Parar no ponto final',c.end),IT('Sem bater na parede',!c.hit,1),IT('Sem tombar',!c.tomb,1)];}},
 {n:'Resgate com garra',custom:()=>rescueArena(true),
  txt:'Adicione a <b>garra com servo</b> na frente do robô (camada de baixo, com espaço livre à frente), pegue um cubo e leve-o até a zona azul.',
  hint:'Abra a garra, ande até "objeto entre os dedos da garra?", feche a garra, leve até a zona azul e solte lá dentro.',
  items:()=>[IT('Garra montada no robô',RB.claw),IT('Pegar um cubo com a garra',TUT.f.claw),IT('Levar um cubo até a zona azul',score()>=1)]}
];
/* peças e blocos liberados por fase */
const MINP={block:1,wheel:1,caster:1,battery:1,color:4,ultra:5,gyro:10,claw:11},TBMIN={'Sensores':4,'Operadores':5,'Variáveis':7,'Garra':11},
  BMIN={cor_ve:4,cor_luz:4,cor_analog:4,timer_get:4,timer_reset:4,ultra:5,gyro:10,score:10,speed:10};
function tbFor(L){return{kind:'categoryToolbox',contents:TB.contents.filter(c=>L>=(TBMIN[c.name]||0)).map(c=>c.contents?Object.assign({},c,{contents:c.contents.filter(b=>L>=(BMIN[b.type]||0))}):c)};}
function tutUI(){const on=TUT.on;$('tut').style.display=on?'block':'none';
  document.querySelector('[data-mode="arena"]').style.display=on?'none':'';
  $('defbot').style.display=$('clawbot').style.display=on?'none':'';
  document.querySelectorAll('[data-part]').forEach(b=>{const m=MINP[b.dataset.part];b.style.display=(on&&m&&TUT.lvl<m)?'none':'';});
  if(on&&MINP[partTool]&&TUT.lvl<MINP[partTool]){partTool='block';document.querySelectorAll('[data-part]').forEach(x=>x.classList.toggle('on',x.dataset.part==='block'));}
  $('tutBtn').textContent=on?'🆓 Modo livre':'🎓 Tutorial';
  try{ws.updateToolbox(on?tbFor(TUT.lvl):TB);}catch(e){}}
function tutList(){const it=LV[TUT.lvl-1].items();
  $('tutL').innerHTML=it.map(x=>'<div class="'+(x.d&&!x.neg?'ok':'')+'">'+(x.neg?(x.d?'○':'✖'):(x.d?'✔':'☐'))+' '+x.t+'</div>').join('');return it;}
function tutRender(){const L=LV[TUT.lvl-1];$('tutT').textContent='Fase '+TUT.lvl+'/'+LV.length+' — '+L.n;$('tutDots').innerHTML=LV.map((x,i)=>'<i class="'+(i+1<TUT.lvl?'d':i+1===TUT.lvl?'c':'')+'" title="Fase '+(i+1)+'"></i>').join('');
  const s=$('tutSel');s.replaceChildren();for(let i=1;i<=Math.min(TUT.max,LV.length);i++)s.add(new Option('Fase '+i+' — '+LV[i-1].n,i));s.value=TUT.lvl;
  $('tutChk').style.display=TUT.lvl===1?'':'none';$('tutD').innerHTML=L.txt+(TUT.hint?'<div class="hint">💡 '+L.hint+'</div>':'');tutList();}
function filesUI(){const b=mode==='build';$('grpArena').style.display=b?'none':'flex';$('grpProj').style.display=b?'flex':'none';}
let emptyOn=null;function emptyUI(){const sh=mode==='sim'&&!parts.length&&!objs.length;if(sh)$('hudR').style.display='none';if(sh!==emptyOn){emptyOn=sh;$('empty').style.display=sh?'flex':'none';}}
function loadLevel(n){n=Math.max(1,Math.min(LV.length,(n|0)||1));const L=LV[n-1];
  TUT.on=true;TUT.lvl=n;TUT.max=Math.max(TUT.max,n);TUT.pause=false;TUT.hint=false;TUT.f={};sim.running=false;OBR.on=false;
  if(L.custom)L.custom();else{setArena(120,80);objs=L.objs().map(o=>Object.assign({},o));Object.assign(START,{x:-108,z:0,a:0});sel=null;touch();}
  tutUI();setMode(L.lm||'sim');tutRender();status('Fase '+n+': '+L.n+'. Leia o objetivo no painel acima.');}
function tutToggle(on){if(on){loadLevel(TUT.lvl);return;}TUT.on=false;TUT.pause=false;tutUI();setMode(mode==='build'?'build':'sim');
  status('Modo livre: Arena e sala da OBR liberadas. Clique em 🎓 Tutorial para voltar às fases.');}
function tutBox(title,msg,btns){const o=document.createElement('div');o.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:70';
  const b=document.createElement('div');b.style.cssText='background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:18px;max-width:min(92vw,430px);display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow-lg)';
  const h=document.createElement('div');h.style.cssText='font-size:20px;font-weight:700;color:var(--ink-dark)';h.textContent=title;
  const t=document.createElement('div');t.textContent=msg;const r=document.createElement('div');r.style.cssText='display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap';
  btns.forEach((x,i)=>{const k=document.createElement('button');k.textContent=x[0];if(i===btns.length-1)k.className='pri';k.onclick=()=>{o.remove();x[1]();};r.appendChild(k);});
  b.append(h,t,r);o.appendChild(b);document.body.appendChild(o);}
function tutWin(){const n=TUT.lvl,save=' Dica: salve seu robô em arquivo (💾) para continuar depois.';
  if(n>=LV.length){TUT.max=LV.length;tutBox('🏆 Tutorial concluído!','Parabéns! Você criou, programou e testou seu robô em todas as fases.'+save+' No Modo livre você pode criar arenas e gerar a sala da OBR.',[['Repetir esta fase',()=>loadLevel(n)],['Ir para o Modo livre',()=>tutToggle(false)]]);}
  else{TUT.max=Math.max(TUT.max,n+1);tutBox('🎉 Fase '+n+' concluída!','Próxima: Fase '+(n+1)+' — '+LV[n].n+'. O mapa será carregado automaticamente.'+save,[['Repetir esta fase',()=>loadLevel(n)],['Próxima fase ▶',()=>loadLevel(n+1)]]);}}
let tutN=0;
function tutTick(){if(!TUT.on)return;$('hudL').style.display='none';if(TUT.pause)return;const L=LV[TUT.lvl-1];
  if(mode==='sim'){const gg=objs.find(o=>o.t==='goal');if(gg&&Math.abs(bot.x-gg.x)<gg.w/2&&Math.abs(bot.z-gg.z)<gg.d/2)TUT.f.goal=1;if(L.tick)L.tick();if(objs.some(o=>isP(o)&&o.held))TUT.f.claw=1;}
  const it=(++tutN%6===0)?tutList():L.items();
  if(!L.manual&&it.length&&it.every(x=>x.d)&&mode===(L.lm||'sim')){TUT.pause=true;sim.running=false;bot.l=bot.r=0;tutWin();}}
$('tutSel').onchange=e=>loadLevel(+e.target.value);
$('tutHint').onclick=()=>{TUT.hint=!TUT.hint;tutRender();};
$('tutRst').onclick=()=>loadLevel(TUT.lvl);
$('tutClr').onclick=()=>{ws.clear();status('Blocos limpos.');};
$('tutChk').onclick=()=>{if(!TUT.on||TUT.lvl!==1||TUT.pause)return;const bad=tutList().filter(x=>!x.d);
  if(bad.length){status('Robô ainda não é viável.');tutBox('Robô incompleto','Ainda falta: '+bad.map(x=>x.t.toLowerCase()).join('; ')+'.',[['Voltar a montar',()=>{}]]);return;}
  const T=tilt(0,0,0);if(T){status('Robô instável.');tutBox('Robô instável',tipMsg(T),[['Voltar a montar',()=>{}]]);return;}
  TUT.pause=true;tutWin();};
$('tutBtn').onclick=()=>tutToggle(!TUT.on);

/* ---------- Salvar / abrir robô em arquivo (.robosim) ---------- */
const slug=s=>(s||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'meu-robo';
function saveRobot(){const name=$('rnm').value.trim()||'Meu robô',fn=slug(name)+'.robosim';
  const data={app:'RoboSim3D',versao:1,nome:name,fase:TUT.lvl,faseMaxima:TUT.max,pecas:parts,frente:FR,blocos:Blockly.serialization.workspaces.save(ws),salvoEm:new Date().toISOString()};
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));a.download=fn;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);status('Robô salvo no arquivo "'+fn+'" (pasta Downloads). Use 📂 Abrir robô para continuar depois.');}
function loadRobotData(o,fn){if(!o||o.app!=='RoboSim3D'||!Array.isArray(o.pecas))throw new Error('formato');
  sim.running=false;FR=((o.frente|0)%4+4)%4;parts=o.pecas.filter(p=>p&&MS[p.t]!==undefined).map(p=>({t:p.t,i:p.i|0,j:p.j|0,k:p.k|0}));dropOrphans();hist.length=0;msel=null;
  for(const k in VARS)delete VARS[k];ws.clear();if(o.blocos)Blockly.serialization.workspaces.load(o.blocos,ws);
  $('rnm').value=o.nome||'';TUT.max=Math.max(TUT.max,o.faseMaxima|0,o.fase|0);
  if(TUT.on)loadLevel(o.fase|0||1);else{buildRobot();resetBot();}
  status('Robô "'+(o.nome||fn)+'" carregado'+(TUT.on?' — continuando na fase '+TUT.lvl+'.':'.'));}
function dlFile(fn,data){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);}
function saveArena(){const name=$('anm').value.trim()||'Minha arena',fn=slug(name)+'.arena';
  dlFile(fn,{app:'RoboSim3D',tipo:'arena',versao:1,nome:name,arena:[AX,AZ],inicio:{x:START.x,z:START.z,a:START.a},objetos:objs,salvoEm:new Date().toISOString()});
  status('Arena salva no arquivo "'+fn+'" (pasta Downloads). Use 📂 Abrir arena para carregar de novo.');}
function loadArenaData(o,fn){if(!o||o.app!=='RoboSim3D'||o.tipo!=='arena'||!Array.isArray(o.objetos))throw new Error('formato');
  const wasTut=TUT.on;if(wasTut){TUT.on=false;TUT.pause=false;tutUI();}
  const ar=(o.arena||[]).map(Number),ok=ar.length===2&&ar.every(v=>v>=40&&v<=400);
  sim.running=false;OBR.on=false;setArena(...(ok?ar:[120,80]));objs=o.objetos.filter(x=>x&&typeof x.t==='string');
  {const ini=o.inicio||{},nv=(v,d)=>Number.isFinite(+v)&&v!==null&&v!==undefined?+v:d;Object.assign(START,{x:nv(ini.x,-100),z:nv(ini.z,0),a:nv(ini.a,0)});}
  sel=null;touch();resetBot();$('anm').value=o.nome||'';status('Arena "'+(o.nome||fn)+'" carregada.'+(wasTut?' O tutorial foi pausado: você está no Modo livre (🎓 Tutorial volta às fases).':''));}
$('arSave').onclick=saveArena;$('arOpen').onclick=()=>$('arFile').click();
$('arFile').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const r=new FileReader();
  r.onload=()=>{try{loadArenaData(JSON.parse(r.result),f.name);}catch(x){status('Arquivo inválido: escolha um arquivo .arena salvo por este simulador.');}};r.readAsText(f);};
$('tutFold').onclick=()=>{const t=$('tut'),f=t.classList.toggle('fold');$('tutFold').textContent=f?'▸':'▾';setTimeout(fit,0);};
$('blkFold').onclick=()=>{const m=document.querySelector('main'),c=m.classList.toggle('cl'),rs=()=>{try{Blockly.svgResize(ws);}catch(e){}fit();};
  $('blkFold').textContent=c?'▶':'◀';$('blkFold').title=c?'Expandir blocos':'Recolher blocos';rs();setTimeout(rs,300);};
$('rbSave').onclick=saveRobot;$('rbOpen').onclick=()=>$('rbFile').click();
$('rbFile').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const r=new FileReader();
  r.onload=()=>{try{loadRobotData(JSON.parse(r.result),f.name);}catch(x){status('Arquivo inválido: escolha um arquivo .robosim salvo por este simulador.');}};r.readAsText(f);};

function fit(){const w=view.clientWidth,h=view.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/Math.max(h,1);camera.updateProjectionMatrix();}
new ResizeObserver(fit).observe(view);
buildRobot();refresh();loadLevel(1);setMode('sim');fit();requestAnimationFrame(frame);
</script>
</body>
